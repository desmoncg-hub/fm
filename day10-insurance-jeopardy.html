y major types of insurance are in your notes?", "answer": "5", "choices": ["5", "3", "4", "10"], "hint": "Health, life, disability, auto, home or renter's."}, {"q": "Insurance helps with this kind of event.", "answer": "Unexpected", "choices": ["Unexpected", "Planned", "Fun", "Monthly"], "hint": "You did not plan it."}]}, {"name": "Auto", "clues": [{"q": "This insurance is required by law if you drive.", "answer": "Auto insurance", "choices": ["Auto insurance", "Life insurance", "Renter's insurance", "Health insurance"], "hint": "Think: cars."}, {"q": "Pays for damage you cause to OTHER people.", "answer": "Liability", "choices": ["Liability", "Collision", "Comprehensive", "Copay"], "hint": "It is the minimum required by law."}, {"q": "Pays to fix YOUR car when you hit something.", "answer": "Collision", "choices": ["Collision", "Liability", "Comprehensive", "Deductible"], "hint": "You COLLIDE with something."}, {"q": "Pays when your car is stolen or you hit a deer.", "answer": "Comprehensive", "choices": ["Comprehensive", "Collision", "Liability", "Premium"], "hint": "Not a crash with another car or object."}]}, {"name": "Home and Renter's", "clues": [{"q": "Protects a homeowner's house and things inside.", "answer": "Home insurance", "choices": ["Home insurance", "Renter's insurance", "Auto insurance", "Life insurance"], "hint": "You OWN the house."}, {"q": "Protects YOUR things in a place you rent.", "answer": "Renter's insurance", "choices": ["Renter's insurance", "Home insurance", "Health insurance", "Auto insurance"], "hint": "You RENT."}, {"q": "Pays what an item is worth NOW, after wear and tear.", "answer": "Cash value", "choices": ["Cash value", "Replacement cost", "Premium", "Copay"], "hint": "Worth NOW."}, {"q": "The amount you pay before insurance pays the rest.", "answer": "Deductible", "choices": ["Deductible", "Premium", "Coinsurance", "Beneficiary"], "hint": "You pay this FIRST."}]}, {"name": "Health", "clues": [{"q": "Pays for doctors, hospitals, and medicine.", "answer": "Health insurance", "choices": ["Health insurance", "Life insurance", "Auto insurance", "Renter's insurance"], "hint": "Think: staying healthy."}, {"q": "What you pay every month for your plan.", "answer": "Premium", "choices": ["Premium", "Copay", "Deductible", "Coinsurance"], "hint": "Every month."}, {"q": "What you pay at the doctor's office during a visit.", "answer": "Copay", "choices": ["Copay", "Premium", "Deductible", "Coinsurance"], "hint": "You pay it AT the visit."}, {"q": "A government health program for people who can't afford health care.", "answer": "Medicaid", "choices": ["Medicaid", "Liability", "Whole life", "Collision"], "hint": "Run by the government."}]}, {"name": "Life and Disability", "clues": [{"q": "Pays money when the insured person dies.", "answer": "Life insurance", "choices": ["Life insurance", "Disability insurance", "Auto insurance", "Home insurance"], "hint": "The end of a LIFE."}, {"q": "The person who receives life insurance money.", "answer": "Beneficiary", "choices": ["Beneficiary", "Landlord", "Insured", "Doctor"], "hint": "They BENEFIT."}, {"q": "Life insurance that lasts a set time, like 20 years.", "answer": "Term life", "choices": ["Term life", "Whole life", "Liability", "Collision"], "hint": "A TERM is a set time."}, {"q": "Replaces 60% to 70% of your pay if you can't work.", "answer": "Disability insurance", "choices": ["Disability insurance", "Life insurance", "Health insurance", "Home insurance"], "hint": "What if you are unable to work?"}]}]};</script><script src="fm.js"></script></body></html>
