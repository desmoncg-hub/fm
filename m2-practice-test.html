<script src="icons.js"></script><script>window.ACTIVITY={"title": "Module 2 Practice Test", "intro": "This practice test looks like the real post-assessment. Read carefully. You may use a calculator.", "remind": null, "items": [{"q": "____ ____ is the length of time for which an employee&#39;s wages are calculated.", "choices": ["Pay period", "Gross pay", "Net pay"], "answer": "Pay period", "hint": "How long until payday?", "why": "The answer is <strong>Pay period</strong>."}, {"q": "____ ____ is the amount of money earned during a pay period before deductions.", "choices": ["Gross pay", "Pay period", "Net pay"], "answer": "Gross pay", "hint": "Before deductions.", "why": "The answer is <strong>Gross pay</strong>."}, {"q": "Kevin earns $9.00 an hour. He worked 40 hours. What is his gross pay?", "choices": ["$360", "$369", "$400"], "answer": "$360", "hint": "40 x $9.", "why": "The answer is <strong>$360</strong>."}, {"q": "Lisa worked 46 hours and earns $10.00 an hour. What is her gross pay with overtime?", "choices": ["$490", "$400", "$90"], "answer": "$490", "hint": "Regular: 40 x $10. Overtime: 6 x $15. Add.", "why": "The answer is <strong>$490</strong>."}, {"q": "Nate earns $11.00 an hour and worked 36 hours. What is his gross pay?", "choices": ["$396", "$39.60", "$3,960"], "answer": "$396", "hint": "36 x $11.", "why": "The answer is <strong>$396</strong>."}, {"q": "Pay for work beyond 40 hours in a week is called ____ ____.", "choices": ["Overtime pay", "Regular pay", "Net pay"], "answer": "Overtime pay", "hint": "Over time.", "why": "The answer is <strong>Overtime pay</strong>."}, {"q": "Sam earns $10.00 an hour. What is his overtime hourly wage?", "choices": ["$15", "$10", "$400"], "answer": "$15", "hint": "$10 x 1.5.", "why": "The answer is <strong>$15</strong>."}, {"q": "A fixed amount paid for each item produced is a ____ ____.", "choices": ["Piece rate", "Production rate", "Gross pay"], "answer": "Piece rate", "hint": "Per piece.", "why": "The answer is <strong>Piece rate</strong>."}, {"q": "____ ____ is the number of items produced in a given amount of time.", "choices": ["Production rate", "Piece rate", "Gross pay"], "answer": "Production rate", "hint": "How fast.", "why": "The answer is <strong>Production rate</strong>."}, {"q": "Jo makes 300 widgets in 6 hours. What is her hourly production rate?", "choices": ["50 widgets / hour", "60 widgets / hour", "30 widgets / hour"], "answer": "50 widgets / hour", "hint": "300 &divide; 6.", "why": "The answer is <strong>50 widgets / hour</strong>."}, {"q": "Lee assembles 32 trains in an 8-hour shift. What is his hourly production rate?", "choices": ["4 trains / hour", "8 trains / hour", "3 trains / hour"], "answer": "4 trains / hour", "hint": "32 &divide; 8.", "why": "The answer is <strong>4 trains / hour</strong>."}, {"q": "Ty makes $0.10 per widget. The production rate is 90 an hour. What is his gross pay for an 8-hour shift?", "choices": ["$72", "$720", "$9"], "answer": "$72", "hint": "90 x 8 = 720. Then 720 x $0.10.", "why": "The answer is <strong>$72</strong>."}, {"q": "Gross pay $600.00. Deductions: $90.00, $42.00, $45.90. What is the net pay?", "choices": ["$422.10", "$600.00", "$177.90"], "answer": "$422.10", "hint": "Add the deductions. Then subtract.", "why": "The answer is <strong>$422.10</strong>."}, {"q": "The money left after all deductions is called ____ ____.", "choices": ["Net pay", "Gross pay", "Overtime pay"], "answer": "Net pay", "hint": "Take-home pay.", "why": "The answer is <strong>Net pay</strong>."}, {"q": "Using the pay stub, how much did Grady pay in federal income tax?", "choices": ["$61.50", "$28.70", "$31.37"], "answer": "$61.50", "hint": "Look in Deductions.", "why": "The answer is <strong>$61.50</strong>.", "art": "<div class='bill'><div class='row2'><div class='sec'><span class='num'>3</span><strong>Personal Information</strong><br>Grady Lee<br>8 Pine St, Raleigh, NC 27601</div><div class='sec'><span class='num'>1</span><strong>Earnings</strong><table><tr><td>Hours</td><td class='r'>40</td></tr><tr><td>Hourly wage</td><td class='r'>$10.25</td></tr><tr><td><strong>Gross pay</strong></td><td class='r'><strong>$410.00</strong></td></tr></table></div></div><div class='sec'><span class='num'>2</span><strong>Deductions</strong><table><tr><td>Federal income tax</td><td class='r'>$61.50</td></tr><tr><td>State income tax</td><td class='r'>$28.70</td></tr><tr><td>FICA</td><td class='r'>$31.37</td></tr><tr><td>Uniform</td><td class='r'>$10.00</td></tr><tr><td><strong>Total deductions</strong></td><td class='r'><strong>$131.57</strong></td></tr></table></div><div class='sec' style='padding-left:12px'><strong>NET PAY: $278.43</strong></div></div>"}, {"q": "The federal program that helps older Americans with income and insurance is ____.", "choices": ["FICA", "Federal income tax", "State income tax"], "answer": "FICA", "hint": "Social Security and Medicare.", "why": "The answer is <strong>FICA</strong>."}, {"q": "Using the pay stub, how much did Grady pay in state income tax?", "choices": ["$28.70", "$61.50", "$31.37"], "answer": "$28.70", "hint": "Look in Deductions.", "why": "The answer is <strong>$28.70</strong>.", "art": "<div class='bill'><div class='row2'><div class='sec'><span class='num'>3</span><strong>Personal Information</strong><br>Grady Lee<br>8 Pine St, Raleigh, NC 27601</div><div class='sec'><span class='num'>1</span><strong>Earnings</strong><table><tr><td>Hours</td><td class='r'>40</td></tr><tr><td>Hourly wage</td><td class='r'>$10.25</td></tr><tr><td><strong>Gross pay</strong></td><td class='r'><strong>$410.00</strong></td></tr></table></div></div><div class='sec'><span class='num'>2</span><strong>Deductions</strong><table><tr><td>Federal income tax</td><td class='r'>$61.50</td></tr><tr><td>State income tax</td><td class='r'>$28.70</td></tr><tr><td>FICA</td><td class='r'>$31.37</td></tr><tr><td>Uniform</td><td class='r'>$10.00</td></tr><tr><td><strong>Total deductions</strong></td><td class='r'><strong>$131.57</strong></td></tr></table></div><div class='sec' style='padding-left:12px'><strong>NET PAY: $278.43</strong></div></div>"}, {"q": "Deductions are money ____.", "choices": ["Taken from your gross pay", "Added to your gross pay", "Taken from your net pay"], "answer": "Taken from your gross pay", "hint": "Deductions come out before net pay.", "why": "The answer is <strong>Taken from your gross pay</strong>."}, {"q": "Using the pay stub, what was Grady&#39;s net pay?", "choices": ["$278.43", "$410.00", "$131.57"], "answer": "$278.43", "hint": "Look at the bottom.", "why": "The answer is <strong>$278.43</strong>.", "art": "<div class='bill'><div class='row2'><div class='sec'><span class='num'>3</span><strong>Personal Information</strong><br>Grady Lee<br>8 Pine St, Raleigh, NC 27601</div><div class='sec'><span class='num'>1</span><strong>Earnings</strong><table><tr><td>Hours</td><td class='r'>40</td></tr><tr><td>Hourly wage</td><td class='r'>$10.25</td></tr><tr><td><strong>Gross pay</strong></td><td class='r'><strong>$410.00</strong></td></tr></table></div></div><div class='sec'><span class='num'>2</span><strong>Deductions</strong><table><tr><td>Federal income tax</td><td class='r'>$61.50</td></tr><tr><td>State income tax</td><td class='r'>$28.70</td></tr><tr><td>FICA</td><td class='r'>$31.37</td></tr><tr><td>Uniform</td><td class='r'>$10.00</td></tr><tr><td><strong>Total deductions</strong></td><td class='r'><strong>$131.57</strong></td></tr></table></div><div class='sec' style='padding-left:12px'><strong>NET PAY: $278.43</strong></div></div>"}, {"q": "Ray earns $12.00 an hour for 40 hours: $480.00 gross. Deductions: $72.00, $33.60, $36.72, $8.00. What is his net pay?", "choices": ["$329.68", "$629.68", "$150.32"], "answer": "$329.68", "hint": "Add the deductions. Then subtract from $480.00.", "why": "The answer is <strong>$329.68</strong>."}], "where": "Module 2: Wages &bull; Review", "shuffle": false, "theme": ["#0B6E6E", "#E2F2F1"], "startArt": "<svg viewBox='0 0 360 200' width='360' height='200' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Start'><rect width='360' height='200' rx='16' fill='#F3F6F9'/><g transform='translate(120 40) scale(1.2)'><path d='M50 6 L62 38 H96 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 H38 Z' fill='#F2B705'/></g></svg>"};</script><script src="fm.js"></script></body></html>
