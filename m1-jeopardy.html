<script src="icons.js"></script><script>window.ACTIVITY={"title": "Module 1 Jeopardy", "intro": "Pick a category and a point value. Answer the clue to earn the points.", "remind": null, "where": "Module 1: Personal Financial Planning &bull; Review", "cats": [{"name": "Goals", "clues": [{"q": "A plan for managing money so you meet your goals over time.", "answer": "Financial planning", "choices": ["Financial planning", "Budget", "Income", "Expense"], "hint": "Think: a PLAN for your money."}, {"q": "A goal you can reach in 1 year or less.", "answer": "Short-term goal", "choices": ["Short-term goal", "Long-term goal", "Budget", "Loan"], "hint": "SHORT time."}, {"q": "A goal that takes more than 1 year.", "answer": "Long-term goal", "choices": ["Long-term goal", "Short-term goal", "Expense", "Deposit"], "hint": "LONG time."}, {"q": "You want $240 in 6 months. How much do you save each month?", "answer": "$40", "choices": ["$40", "$1,440", "$246", "$24"], "hint": "Divide: $240 \u00f7 6 = ?"}]}, {"name": "Income and Expenses", "clues": [{"q": "Money you earn from a job or get from another source.", "answer": "Income", "choices": ["Income", "Expense", "Budget", "Loan"], "hint": "Money coming IN."}, {"q": "Things you must have to live.", "answer": "Needs", "choices": ["Needs", "Wants", "Expenses", "Goals"], "hint": "You can't live without them."}, {"q": "An expense that is the same amount every time.", "answer": "Fixed expense", "choices": ["Fixed expense", "Variable expense", "Periodic expense", "Income"], "hint": "It does not change."}, {"q": "An expense that comes regularly, but less often than every month.", "answer": "Periodic expense", "choices": ["Periodic expense", "Fixed expense", "Variable expense", "Want"], "hint": "Think: car insurance or holiday gifts."}]}, {"name": "Budgets", "clues": [{"q": "A plan for how you are going to spend your money.", "answer": "Budget", "choices": ["Budget", "Loan", "Income", "Check"], "hint": "A money plan."}, {"q": "A part out of 100.", "answer": "Percent", "choices": ["Percent", "Principal", "Balance", "Interest"], "hint": "The % sign."}, {"q": "What is 20% of $600?", "answer": "$120", "choices": ["$120", "$12", "$1,200", "$620"], "hint": "0.20 x 600 = ?"}, {"q": "The FIRST step of budgeting.", "answer": "Record your monthly income", "choices": ["Record your monthly income", "List your wants", "Use percents", "Open a credit union account"], "hint": "What do you write down before expenses?"}]}, {"name": "Banks", "clues": [{"q": "Borrowed money.", "answer": "Loan", "choices": ["Loan", "Deposit", "Balance", "Income"], "hint": "You have to pay it back."}, {"q": "A nonprofit owned by its members.", "answer": "Credit union", "choices": ["Credit union", "Commercial bank", "Payday loan", "Savings and loan"], "hint": "You must join."}, {"q": "A lender with very high interest that you should stay away from.", "answer": "Payday loan", "choices": ["Payday loan", "Credit union", "Commercial bank", "Savings account"], "hint": "Pay late and owe 2 to 3 times as much."}, {"q": "A percent paid on money in an account or on money owed.", "answer": "Interest rate", "choices": ["Interest rate", "Principal", "Balance", "Budget"], "hint": "It has 'rate' in the name."}]}, {"name": "Checking and Savings", "clues": [{"q": "To put money into an account.", "answer": "Deposit", "choices": ["Deposit", "Withdrawal", "Endorse", "Loan"], "hint": "Money going IN."}, {"q": "A personal record of your checking account transactions.", "answer": "Check register", "choices": ["Check register", "Deposit slip", "Bank statement", "Budget"], "hint": "You write every transaction here."}, {"q": "To sign the back of a check.", "answer": "Endorse", "choices": ["Endorse", "Deposit", "Withdraw", "Balance"], "hint": "You do this before you cash a paycheck."}, {"q": "When an account does not have enough money to cover a payment.", "answer": "Insufficient funds", "choices": ["Insufficient funds", "Simple interest", "Balance", "Principal"], "hint": "Not ENOUGH money."}]}], "mode": "board", "theme": ["#1D4E89", "#E6EEF8"], "startArt": "<svg viewBox='0 0 360 200' width='360' height='200' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Start'><rect width='360' height='200' rx='16' fill='#F3F6F9'/><g transform='translate(120 40) scale(1.2)'><path d='M50 6 L62 38 H96 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 H38 Z' fill='#F2B705'/></g></svg>"};</script><script src="fm.js"></script></body></html>
