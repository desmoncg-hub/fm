<script src="icons.js"></script><script>window.ACTIVITY={"title": "Module 6 Practice Test", "where": "Module 6 Review", "intro": "This practice test looks like the real post-assessment. Read each question carefully. Look for the word NOT. You may use your notes and a calculator.", "remind": "Look for NOT. It changes the answer!", "noun": "Question", "shuffle": false, "items": [{"q": "Which of the following is NOT one of the five major types of insurance?", "choices": ["Pet insurance", {"label": "Life", "icon": "life"}, {"label": "Disability", "icon": "disability"}], "answer": "Pet insurance", "hint": "The 5 types are health, life, disability, auto, and home or renter's.", "why": "The answer is <strong>Pet insurance</strong>."}, {"q": "True or False: Liability is the minimum auto insurance required by law.", "choices": [{"label": "True", "icon": "check"}, {"label": "False", "icon": "xmark"}], "answer": "True", "hint": "Which type protects OTHER people?", "why": "The answer is <strong>True</strong>."}, {"q": "Insurance financially protects you from ______ events.", "choices": ["Unexpected", "Planned", "Fun"], "answer": "Unexpected", "hint": "Did you plan for it?", "why": "The answer is <strong>Unexpected</strong>."}, {"q": "Priya owns a condo, rides the bus everywhere, and works at a bank. What type of insurance does she NOT need?", "choices": [{"label": "Auto", "icon": "car"}, {"label": "Health", "icon": "health"}, {"label": "Disability", "icon": "disability"}], "answer": "Auto", "hint": "Does she drive?", "why": "The answer is <strong>Auto</strong>."}, {"q": "Tia's car slid into a ditch and she sprained her wrist. What type of insurance will NOT help her?", "choices": [{"label": "Renter's", "icon": "apt"}, {"label": "Health", "icon": "health"}, {"label": "Auto", "icon": "car"}], "answer": "Renter's", "hint": "Which one has nothing to do with cars or injuries?", "why": "The answer is <strong>Renter's</strong>."}, {"q": "Which of the following is NOT an unexpected event?", "choices": ["A birthday party", "A flood", "A broken leg"], "answer": "A birthday party", "hint": "Which one is planned?", "why": "The answer is <strong>A birthday party</strong>."}, {"q": "Which of the following is NOT one of the three major types of car insurance?", "choices": [{"label": "Home", "icon": "house"}, {"label": "Collision", "icon": "bang"}, {"label": "Liability", "icon": "person"}], "answer": "Home", "hint": "The 3 types are liability, collision, and comprehensive.", "why": "The answer is <strong>Home</strong>."}, {"q": "Renter's insurance protects the person from:", "choices": ["Loss of their possessions inside where they live", "Car damage from an accident", "Hospital bills from an illness"], "answer": "Loss of their possessions inside where they live", "hint": "What does a renter own?", "why": "The answer is <strong>Loss of their possessions inside where they live</strong>."}, {"q": "Life insurance money goes to the:", "choices": [{"label": "Beneficiary", "icon": "life"}, "Landlord", "Doctor"], "answer": "Beneficiary", "hint": "Which word means the person who receives the money?", "why": "The answer is <strong>Beneficiary</strong>."}, {"q": "Kevin is 18, rents an apartment with friends, and does not have a job. What type of insurance does he NOT need?", "choices": [{"label": "Disability", "icon": "disability"}, {"label": "Health", "icon": "health"}, {"label": "Renter's", "icon": "apt"}], "answer": "Disability", "hint": "Disability replaces income from a job.", "why": "The answer is <strong>Disability</strong>."}, {"q": "True or False: A copay is the amount you pay at the time you get medical care.", "choices": [{"label": "True", "icon": "check"}, {"label": "False", "icon": "xmark"}], "answer": "True", "hint": "When do you pay a copay?", "why": "The answer is <strong>True</strong>."}, {"q": "Which factor does NOT affect how much car insurance costs?", "choices": ["Your favorite color", "Your age", "Your driving record"], "answer": "Your favorite color", "hint": "Which one has nothing to do with driving?", "why": "The answer is <strong>Your favorite color</strong>."}, {"q": "Which factor does NOT affect the cost of home insurance?", "choices": ["The homeowner's favorite sports team", "A swimming pool", "The home's location"], "answer": "The homeowner's favorite sports team", "hint": "Which one has nothing to do with risk?", "why": "The answer is <strong>The homeowner's favorite sports team</strong>."}, {"q": "Medicare and Medicaid are ______ health insurance programs.", "choices": [{"label": "Government", "icon": "capitol"}, {"label": "Private", "icon": "person"}, {"label": "Employer", "icon": "building"}], "answer": "Government", "hint": "Who runs them?", "why": "The answer is <strong>Government</strong>."}, {"q": "Disability insurance usually pays ______ of a person's income while they cannot work.", "choices": ["60% to 70%", "30% to 40%", "100%"], "answer": "60% to 70%", "hint": "Check your notes.", "why": "The answer is <strong>60% to 70%</strong>."}, {"q": "Which person would pay more for car insurance?", "choices": ["A driver with 3 accidents this year", "A driver with a clean record"], "answer": "A driver with 3 accidents this year", "hint": "Who is riskier to insure?", "why": "The answer is <strong>A driver with 3 accidents this year</strong>."}, {"q": "Jada's belongings are worth $16,200. Which coverage should she choose?", "choices": ["$20,000", "$10,000", "$15,000"], "answer": "$20,000", "hint": "Choose the smallest coverage that is MORE than her total.", "why": "The answer is <strong>$20,000</strong>."}, {"q": "A storm caused $9,000 in damage to a house. The owner paid $1,000. How much did insurance save the owner?", "choices": ["$8,000", "$10,000", "$1,000"], "answer": "$8,000", "hint": "Subtract: $9,000 \u2212 $1,000 = ?", "why": "The answer is <strong>$8,000</strong>."}, {"q": "True or False: Term life insurance protects you for your whole life.", "choices": [{"label": "False", "icon": "xmark"}, {"label": "True", "icon": "check"}], "answer": "False", "hint": "A TERM is a set amount of time.", "why": "The answer is <strong>False</strong>."}, {"q": "Ben earns $2,800 a month. He has surgery and is out of work 2 months. His disability policy pays 70%. How much will he receive in total?", "choices": ["$3,920", "$1,960", "$5,600"], "answer": "$3,920", "hint": "$2,800 x 2 = ? Then multiply by 0.70.", "why": "The answer is <strong>$3,920</strong>."}], "startArt": "<svg viewBox='0 0 360 200' width='360' height='200' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Quiz'><rect width='360' height='200' rx='16' fill='#F3F6F9'/><g transform='translate(60 40) scale(1.2)'><rect x='16' y='14' width='68' height='80' rx='6' fill='#8B5A2B'/><rect x='22' y='22' width='56' height='66' fill='#fff'/><rect x='38' y='8' width='24' height='12' rx='3' fill='#9AA5B1'/><rect x='28' y='34' width='44' height='5' fill='#9AA5B1'/><rect x='28' y='46' width='44' height='5' fill='#9AA5B1'/><rect x='28' y='58' width='44' height='5' fill='#9AA5B1'/><rect x='28' y='70' width='44' height='5' fill='#9AA5B1'/></g><g transform='translate(190 40) scale(1.1)'><path d='M50 6 L62 38 H96 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 H38 Z' fill='#F2B705'/></g></svg>"};</script><script src="fm.js"></script></body></html>
