<script src="icons.js"></script><script>window.ACTIVITY={"title": "Module 1 Practice Test", "intro": "This practice test looks like the real post-assessment. Read each question carefully.", "remind": null, "items": [{"q": "True or False: Your car payment of $275 every month is a variable expense.", "choices": ["False", "True"], "answer": "False", "hint": "Is the car payment the same every month?", "why": "The answer is <strong>False</strong>.", "fixed": true}, {"q": "True or False: When you start a budget, you list your expenses before your income.", "choices": ["False", "True"], "answer": "False", "hint": "What is Step 1 of budgeting?", "why": "The answer is <strong>False</strong>.", "fixed": true}, {"q": "Which is an example of a WANT?", "choices": ["A new video game", "Groceries", "Rent", "Electricity"], "answer": "A new video game", "hint": "Which one could you live without?", "why": "The answer is <strong>A new video game</strong>."}, {"q": "What is the safest way to log in to your bank app?", "choices": ["On your home Wi-Fi with a password", "On free Wi-Fi at a coffee shop", "On a public library computer", "On free Wi-Fi at the mall"], "answer": "On your home Wi-Fi with a password", "hint": "Which one is private?", "why": "The answer is <strong>On your home Wi-Fi with a password</strong>."}, {"q": "Which is an example of a LONG-TERM goal?", "choices": ["Saving for 4 years for a $2,000 used car", "Saving for 2 months for a $50 game", "Saving for 6 months for $300 shoes"], "answer": "Saving for 4 years for a $2,000 used car", "hint": "Which one takes more than 1 year?", "why": "The answer is <strong>Saving for 4 years for a $2,000 used car</strong>."}, {"q": "Kia wants to save $420 over the next 6 months for a concert trip. How much should she save each month?", "choices": ["$70", "$2,520", "$42"], "answer": "$70", "hint": "Divide: $420 \u00f7 6 = ?", "why": "The answer is <strong>$70</strong>."}, {"q": "Mr. Brown wants to save $3,000 over the next 2 years for a new roof. How much should he save each month?", "choices": ["$125", "$1,500", "$250"], "answer": "$125", "hint": "Change 2 years to 24 months. Then divide: $3,000 \u00f7 24 = ?", "why": "The answer is <strong>$125</strong>."}, {"q": "Which is NOT a source of income?", "choices": ["Buying groceries", "A paycheck", "A Social Security check"], "answer": "Buying groceries", "hint": "Which one is money going OUT?", "why": "The answer is <strong>Buying groceries</strong>."}, {"q": "Dana pays for car insurance twice a year. This is a:", "choices": ["Periodic expense", "Fixed expense", "Variable expense"], "answer": "Periodic expense", "hint": "Is twice a year less often than every month?", "why": "The answer is <strong>Periodic expense</strong>."}, {"q": "Which is one of the steps in making a budget?", "choices": ["Record expenses, listing needs first, then wants.", "Buy all your wants first.", "Skip recording your income."], "answer": "Record expenses, listing needs first, then wants.", "hint": "Look at your 4 budgeting steps.", "why": "The answer is <strong>Record expenses, listing needs first, then wants.</strong>."}, {"q": "Leo earns $1,800 a month. His rent should be 35% of his pay. How much is his rent?", "choices": ["$630", "$63", "$6,300"], "answer": "$630", "hint": "0.35 x 1,800 = ?", "why": "The answer is <strong>$630</strong>."}, {"q": "Nia is saving $4,000 for a car in 2 years, but she is not saving enough each month. What should she do?", "choices": ["Keep saving for more months until she has $4,000", "Give up on her goal", "Spend more on fun"], "answer": "Keep saving for more months until she has $4,000", "hint": "What are the 2 smart fixes?", "why": "The answer is <strong>Keep saving for more months until she has $4,000</strong>."}, {"q": "Sam is not saving enough for a goal and wants to cut spending in another category. Which is the best one to cut?", "choices": ["Movies and fun - 10%", "Rent - 35%", "Electric bill - 5%"], "answer": "Movies and fun - 10%", "hint": "Which one is a WANT?", "why": "The answer is <strong>Movies and fun - 10%</strong>."}, {"q": "What type of transaction takes money OUT of your bank account?", "choices": ["Using your debit card at a store", "Depositing your paycheck", "A direct deposit from your job"], "answer": "Using your debit card at a store", "hint": "Which one is a withdrawal?", "why": "The answer is <strong>Using your debit card at a store</strong>."}, {"q": "A nonprofit financial institution owned by its members is a:", "choices": ["Credit union", "Commercial bank", "Payday loan"], "answer": "Credit union", "hint": "Who owns it?", "why": "The answer is <strong>Credit union</strong>."}, {"q": "Your check register balance is $320.50. You write Check #140 for $45.25. What is your new balance?", "choices": ["$275.25", "$365.75", "$285.25"], "answer": "$275.25", "hint": "A check is a withdrawal. Subtract.", "why": "The answer is <strong>$275.25</strong>."}, {"q": "On a check, where do you write the name of the company you are paying?", "choices": ["Blank 2", "Blank 4", "Blank 5"], "answer": "Blank 2", "hint": "Look for 'Pay to the order of.'", "why": "The answer is <strong>Blank 2</strong>.", "art": "<div class='bill' style='background:#EEF5FB'><div style='display:flex;justify-content:space-between;padding:8px 10px'><div><strong>Jordan Rivera</strong><br>45 Maple Street<br>Kannapolis, NC 28081</div><div style='text-align:right'>Check No. 1042<br>Date <span class='num' style='position:static;display:inline-flex'>1</span> ____________</div></div><div style='padding:4px 10px'>Pay to the order of <span class='num' style='position:static;display:inline-flex'>2</span> ________________________ <span style='border:2px solid #555;padding:2px 8px'>$ <span class='num' style='position:static;display:inline-flex'>3</span> ______</span></div><div style='padding:4px 10px'><span class='num' style='position:static;display:inline-flex'>4</span> ______________________________________ Dollars</div><div style='display:flex;justify-content:space-between;padding:4px 10px 8px'><div>Memo <span class='num' style='position:static;display:inline-flex'>5</span> __________</div><div><span class='num' style='position:static;display:inline-flex'>6</span> ____________________ (signature)</div></div><div style='padding:4px 10px 10px;font-family:monospace;font-size:17px'>&#9286;053100494&#9286; <span class='num' style='position:static;display:inline-flex'>7</span> 2215778104&#9288; 1042</div></div>", "fixed": true}, {"q": "Ty has an account where he can deposit money, write checks, and use a debit card. What type of account is this?", "choices": ["Checking account", "Savings account", "Certificate of deposit"], "answer": "Checking account", "hint": "Which account uses checks?", "why": "The answer is <strong>Checking account</strong>."}], "where": "Module 1: Personal Financial Planning &bull; Review", "shuffle": false, "theme": ["#1D4E89", "#E6EEF8"], "startArt": "<svg viewBox='0 0 360 200' width='360' height='200' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Start'><rect width='360' height='200' rx='16' fill='#F3F6F9'/><g transform='translate(120 40) scale(1.2)'><path d='M50 6 L62 38 H96 L68 58 L78 92 L50 72 L22 92 L32 58 L4 38 H38 Z' fill='#F2B705'/></g></svg>"};</script><script src="fm.js"></script></body></html>
